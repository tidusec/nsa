# https://quarkus.io/guides/all-config

nsa.datagen=true

# https://docs.quarkiverse.io/quarkus-jdbc-sqlite/dev/index.html
quarkus.hibernate-orm.database.generation=drop-and-create
# The file is created at build/classes/java/main/db/nsa-db.sqlite
quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.db-kind=h2
%prod.quarkus.datasource.username=dbuser
%prod.quarkus.datasource.password=superSecret
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://nsa-db:5432/vulndb
quarkus.default-locale=en_US
quarkus.http.access-log.enabled=true
